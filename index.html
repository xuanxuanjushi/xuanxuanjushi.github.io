<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>覃露雨的闺房 · 设计资产与 AI 工具</title>
<meta name="description" content="设计资产、AI 工具、3D 素材与学习资料合集。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23e2ff1a'/><rect x='11' y='11' width='10' height='10' rx='2' fill='%230d1000'/></svg>">
<link rel="stylesheet" href="assets/css/site.css">
</head>
<body>

<header class="topbar">
  <button class="icon-btn" type="button" data-side-toggle aria-label="切换侧栏" title="切换侧栏">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>

  <a class="logo" href="index.html">
    <span class="logo-mark" aria-hidden="true"></span>
    <span class="logo-text" data-site-name>覃露雨的闺房</span>
  </a>

  <form class="search" data-search-form role="search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM20 20l-4.3-4.3"/></svg>
    <input type="search" id="q" placeholder="搜索资源、工具、分类…" autocomplete="off" aria-label="搜索">
    <kbd>/</kbd>
  </form>

  <div class="top-actions">
    <a class="btn sm acid" href="#" data-need-login><span>会员中心</span></a>
    <a class="btn sm ghost" href="#" data-need-login><span>登录 / 注册</span></a>
    <button class="icon-btn" type="button" data-theme-toggle aria-label="切换深浅色" title="切换深浅色">◐</button>
  </div>
</header>

<div class="shell">
  <aside class="sidebar" aria-label="侧栏导航">
    <div class="side-inner" data-sidebar></div>
  </aside>

  <main class="content">
    <div class="content-inner">

      <div class="page-head">
        <div>
          <h1 id="pageTitle">全部资源</h1>
          <p class="sub" id="pageSub">共 0 件资源</p>
        </div>
        <div class="head-tools">
          <label class="sr-only" for="sortSel">排序</label>
          <select class="select" id="sortSel">
            <option value="new">最新更新</option>
            <option value="hot">最多下载</option>
            <option value="free">免费优先</option>
            <option value="price">价格从低到高</option>
          </select>
        </div>
      </div>

      <div class="chips" id="chips" role="group" aria-label="分类筛选"></div>

      <div class="grid-cards" id="grid" aria-live="polite"></div>

      <div class="more-row">
        <button class="btn" type="button" id="loadMore">加载更多</button>
        <span class="count" id="count"></span>
      </div>

      <footer class="foot">
        <span>© <span data-year>2026</span> <span data-site-name>覃露雨的闺房</span></span>
        <span class="mono">P1 · 前端骨架 / 假数据</span>
        <div class="links">
          <a href="works.html">我的作品集</a>
          <a href="deploy.html">发布中心</a>
          <a href="admin/upload.html">上传资源</a>
        </div>
      </footer>

    </div>
  </main>
</div>

<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/list.js"></script>
</body>
</html>
